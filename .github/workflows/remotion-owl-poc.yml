# Remotion Owl POC — render the OwlLesson composition on GitHub Actions.
#
# IMPORTANT — WHERE THIS FILE MUST LIVE:
# GitHub Actions only discovers workflows in the REPO-ROOT .github/workflows/.
# This file is kept next to the project for review; to actually run it, copy
# it to <repo>/.github/workflows/remotion-owl-poc.yml and set PROJECT_DIR
# below to the path where this project is committed in that repo.
# (If this project becomes its own repo, PROJECT_DIR is "." and the copy
# step is unnecessary.)
#
# What it does:
#   1. npm ci (pinned deps + lockfile — Remotion version and the Chrome
#      Headless Shell it downloads are both locked by the lockfile).
#   2. Validates the composition registers: `remotion compositions`.
#   3. Optional narration: if public/audio/a06.wav + a07.wav are present
#      (Maya 2 lines a06-a07), ffmpeg concatenates them to a06-a07.wav and
#      the render gets --props '{"audioFile":"audio/a06-a07.wav"}'.
#      If the audio is absent, the render is silent (the POC default).
#   4. Renders OwlLesson (1920x1080, 30fps, 900 frames) to out/owl-lesson.mp4.
#   5. Uploads the mp4 as artifact "owl-lesson-poc".
#
# Chrome: Remotion downloads its own Chrome Headless Shell (~100 MB) on the
# first render; no apt Chrome install is needed on ubuntu-latest. The
# download is cached in node_modules/.remotion between runs.
# CPU only, no GPU. --concurrency=2 keeps Chrome memory use safe on the
# stock 4-vCPU / 7 GB runner.
name: Remotion Owl POC

on:
  workflow_dispatch:

env:
  # Path of this project inside the repo ("." if it is its own repo).
  PROJECT_DIR: poc-ashwatthama-2d

jobs:
  render:
    name: Render OwlLesson (Remotion)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Cache Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-4.0.545

      - name: Install dependencies
        run: npm ci

      - name: Validate compositions (no render yet)
        run: npx remotion compositions src/index.ts

      - name: Prepare narration audio (optional)
        run: |
          if [ -f public/audio/a06.wav ] && [ -f public/audio/a07.wav ]; then
            ffmpeg -i public/audio/a06.wav -i public/audio/a07.wav \
              -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[a]" -map "[a]" \
              public/audio/a06-a07.wav
            echo 'AUDIO_PROPS={"audioFile":"audio/a06-a07.wav"}' >> "$GITHUB_ENV"
            echo "narration audio found — rendering WITH audio"
          else
            echo 'AUDIO_PROPS={}' >> "$GITHUB_ENV"
            echo "no narration audio — rendering silent POC"
          fi

      - name: Render OwlLesson
        run: npx remotion render src/index.ts OwlLesson out/owl-lesson.mp4 --props="$AUDIO_PROPS" --concurrency=2

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-lesson-poc
          path: ${{ env.PROJECT_DIR }}/out/owl-lesson.mp4
          retention-days: 7
