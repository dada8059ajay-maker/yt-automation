name: gold-video
on:
  workflow_dispatch:
    inputs:
      publish: { default: 'no' }
      ch: { default: 'both' }
permissions: { contents: write }
jobs:
  render:
    strategy: { matrix: { ch: [kahani, raat] } }
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.ch != 'both' && inputs.ch != matrix.ch
        run: echo skip && exit 0
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg && pip install -q edge-tts pillow
      - run: python3 engine/gold_video.py ${{ matrix.ch }}
      - if: inputs.publish == 'yes'
        run: python3 engine/gold_publish.py ${{ matrix.ch }}
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: gold-${{ matrix.ch }}
          path: 'docs/test/*.mp4'
