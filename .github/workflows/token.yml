name: yt-token
on:
  workflow_dispatch:
    inputs:
      name: {description: "raat or kahani", required: true}
      pass: {description: "one-time passphrase", required: true}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
          N: ${{ inputs.name }}
          P: ${{ inputs.pass }}
        run: |
          F=secrets/yt_refresh_$N.enc; [ "$N" = kahani ] && F=secrets/yt_refresh.enc
          RT=$(openssl enc -d -aes-256-cbc -pbkdf2 -in $F -pass env:CSEC); export RT
          python3 -c "
          import os,json,urllib.request,urllib.parse
          d=urllib.parse.urlencode({'refresh_token':os.environ['RT'],'client_id':os.environ['CID'],'client_secret':os.environ['CSEC'],'grant_type':'refresh_token'}).encode()
          open('at.txt','w').write(json.load(urllib.request.urlopen('https://oauth2.googleapis.com/token',d))['access_token'])"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in at.txt -out secrets/at_$N.enc -pass env:P; rm at.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add secrets/; git commit -m "at $N"; git pull --rebase; git push
