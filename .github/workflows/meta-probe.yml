name: meta-probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CSEC: ${{ secrets.YT_CLIENT_SECRET }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 engine/social_publish.py --probe | tee probe.txt
      - run: |
          mkdir -p logs; cp probe.txt logs/meta_probe.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add logs/meta_probe.txt secrets/ 2>/dev/null; git commit -qm "meta probe [skip ci]" && git pull -q --rebase && git push -q || true
