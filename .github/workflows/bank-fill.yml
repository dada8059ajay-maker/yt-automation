name: bank-fill
on: workflow_dispatch
permissions: { contents: write }
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: python3 engine/bank_fill.py
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          for i in 1 2 3 4 5; do
            cp engine/story_bank.json /tmp/sb.json; cp metadata_queue.json /tmp/mq.json 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/sb.json engine/story_bank.json; cp /tmp/mq.json metadata_queue.json 2>/dev/null || true
            git add engine/story_bank.json metadata_queue.json; git commit -qm "bank-fill: new long scripts + metadata [skip ci]" || exit 0
            git push -q origin main && exit 0; sleep 5
          done
