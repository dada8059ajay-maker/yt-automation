name: purge
on:
  workflow_dispatch:
    inputs:
      cutoff: { default: '2026-11-03T18:30:00Z' }
      unsched: { default: '' }
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 engine/purge.py
        env:
          CUTOFF: ${{ inputs.cutoff }}
          UNSCHED: ${{ inputs.unsched }}
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
