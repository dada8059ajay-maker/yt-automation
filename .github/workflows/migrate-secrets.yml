name: migrate-secrets
# one-time: re-wraps the old encrypted token files for the owner's own key, so they can move into GitHub Secrets. Prints nothing secret.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +x; mkdir w
          for f in yt_refresh yt_refresh_raat meta; do
            [ -f secrets/$f.enc ] || continue
            openssl enc -d -aes-256-cbc -pbkdf2 -in secrets/$f.enc -pass env:CSEC -out /tmp/p 2>/dev/null || { echo "skip $f"; continue; }
            openssl rand -hex 32 > /tmp/k
            openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/p -out w/$f.bin -pass file:/tmp/k
            openssl pkeyutl -encrypt -pubin -inkey .github/migrate_pub.pem -in /tmp/k -out w/$f.key
            echo "wrapped $f ($(wc -c </tmp/p) bytes)"; shred -u /tmp/p /tmp/k
          done
        env: { CSEC: "${{ secrets.YT_CLIENT_SECRET }}" }
      - uses: actions/upload-artifact@v4
        with: { name: wrapped, path: w, retention-days: 1 }
