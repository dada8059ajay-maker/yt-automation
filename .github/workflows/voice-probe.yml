name: voice-probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: "~/.cache/huggingface\n~/.cache/pip", key: local-tts-v1 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile git+https://github.com/huggingface/parler-tts.git
      - env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python3 engine/probe/voice_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-probe, path: probe_out/ }
