name: secret-scan
# Blocks any commit that contains an API key, token or password (gitleaks, free/open source).
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest dir /repo --redact --no-banner -v
