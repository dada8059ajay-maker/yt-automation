name: secret-names
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - env: { ALL: "${{ toJSON(secrets) }}" }
        run: |
          python3 - <<'P' > names.txt
          import json, os
          d = json.loads(os.environ["ALL"])
          for k, v in sorted(d.items()):
              if k == "github_token": continue
              kind = "gemini" if v.startswith("AIza") else "hf" if v.startswith("hf_") else "pollinations" if v[:3] in ("sk_", "pk_") else "openai" if v.startswith("sk-") else "other"
              print(k, len(v), kind)
          P
          cat names.txt
      - uses: actions/upload-artifact@v4
        with: { name: names, path: names.txt }
