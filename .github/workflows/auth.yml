name: youtube-auth
on:
  workflow_dispatch:
    inputs:
      code:
        description: "OAuth code (empty = print consent URL)"
        required: false
        default: ""
      name:
        description: "token file suffix"
        required: false
        default: "raat"
permissions:
  contents: write
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consent URL
        if: ${{ inputs.code == '' }}
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os,urllib.parse,base64
          q=urllib.parse.urlencode({"client_id":os.environ["CID"],"redirect_uri":"http://localhost","response_type":"code","scope":"https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube","access_type":"offline","prompt":"consent"})
          open("auth_url.b64","w").write(base64.b64encode(("https://accounts.google.com/o/oauth2/v2/auth?"+q).encode()).decode())
          PY
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add auth_url.b64; git commit -m "auth url"; git push
      - name: Exchange code
        if: ${{ inputs.code != '' }}
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse
          d=urllib.parse.urlencode({"code":os.environ["CODE"],"client_id":os.environ["CID"],"client_secret":os.environ["CSEC"],"redirect_uri":"http://localhost","grant_type":"authorization_code"}).encode()
          try:
            r=json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token",d))
          except urllib.error.HTTPError as e:
            print("ERR",e.read().decode()); raise SystemExit(1)
          rt=r.get("refresh_token")
          if not rt: print("NO_REFRESH_TOKEN",list(r)); raise SystemExit(1)
          open("rt.txt","w").write(rt)
          PY
          mkdir -p secrets
          openssl enc -aes-256-cbc -pbkdf2 -salt -in rt.txt -out secrets/yt_refresh_${{ inputs.name }}.enc -pass env:CSEC
          rm rt.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add secrets/; git commit -m "store encrypted yt token"; git push
          echo AUTH_OK
