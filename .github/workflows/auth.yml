name: youtube-auth
# Writes the YouTube refresh token straight into GitHub Repository Secrets (YT_REFRESH_KAHANI / YT_REFRESH_RAAT).
# Nothing is ever written to a file or committed. Needs repo secret GH_PAT (fine-grained PAT, this repo, "Secrets: Read and write").
on:
  workflow_dispatch:
    inputs:
      code:
        description: "OAuth code (empty = print consent URL)"
        required: false
        default: ""
      channel:
        description: "kahani or raat"
        required: true
        default: "raat"
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Consent URL
        if: ${{ inputs.code == '' }}
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os,urllib.parse
          q=urllib.parse.urlencode({"client_id":os.environ["CID"],"redirect_uri":"http://localhost","response_type":"code","scope":"https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube","access_type":"offline","prompt":"consent"})
          print("Open, sign in with the channel's Google account, copy `code=` from the localhost URL:\n\nhttps://accounts.google.com/o/oauth2/v2/auth?"+q)
          PY
      - name: Exchange code -> GitHub Secret
        if: ${{ inputs.code != '' }}
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CH: ${{ inputs.channel }}
        run: |
          case "$CH" in kahani|raat) ;; *) echo "::error::channel must be kahani or raat"; exit 1;; esac
          [ -n "$GH_TOKEN" ] || { echo "::error::BLOCKED add repo secret GH_PAT first"; exit 1; }
          RT=$(python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,sys
          d=urllib.parse.urlencode({"code":os.environ["CODE"],"client_id":os.environ["CID"],"client_secret":os.environ["CSEC"],"redirect_uri":"http://localhost","grant_type":"authorization_code"}).encode()
          try: r=json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token",d))
          except urllib.error.HTTPError as e: print("ERR",e.code,file=sys.stderr); sys.exit(1)
          rt=r.get("refresh_token") or ""
          if not rt: print("NO_REFRESH_TOKEN",file=sys.stderr); sys.exit(1)
          print(rt)
          PY
          )
          echo "::add-mask::$RT"
          NAME="YT_REFRESH_$(echo "$CH" | tr a-z A-Z)"
          printf '%s' "$RT" | gh secret set "$NAME" --repo "$GITHUB_REPOSITORY"
          unset RT
          echo "AUTH_OK secret $NAME set"
