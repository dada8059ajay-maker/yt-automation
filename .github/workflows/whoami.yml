name: yt-whoami
on: workflow_dispatch
permissions:
  contents: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          : > whoami.txt
          for f in secrets/*.enc; do
          RT=$(openssl enc -d -aes-256-cbc -pbkdf2 -in $f -pass env:CSEC)
          export RT F=$f
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse
          d=urllib.parse.urlencode({"refresh_token":os.environ["RT"],"client_id":os.environ["CID"],"client_secret":os.environ["CSEC"],"grant_type":"refresh_token"}).encode()
          at=json.load(urllib.request.urlopen("https://oauth2.googleapis.com/token",d))["access_token"]
          r=urllib.request.Request("https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true",headers={"Authorization":"Bearer "+at})
          j=json.load(urllib.request.urlopen(r))
          open("whoami.txt","a").write(os.environ["F"]+" => "+"\n".join(i["id"]+" | "+i["snippet"]["title"]+" | "+i["snippet"].get("customUrl","") for i in j.get("items",[])) +"\n")
          PY
          done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add whoami.txt; git commit -m whoami; git push
