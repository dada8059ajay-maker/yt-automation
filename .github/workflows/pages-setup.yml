name: pages-setup
on: workflow_dispatch
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=main" -f "source[path]=/docs" || \
          gh api -X PUT repos/${{ github.repository }}/pages -f "source[branch]=main" -f "source[path]=/docs" || true
          gh api repos/${{ github.repository }}/pages || true
